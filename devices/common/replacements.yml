replacements:
- id: charger_v6_update
  description: Charger V6 Update for Android 14
  type: unzip_override
  source: devices/common/assets/charger-v6-update.zip
  target_base_dir: build/target/
  condition:
    android_version:
      min: 14
      max: 14
  removes:
  - odm/bin/hw/vendor.oplus.hardware.charger-V3-service
  - odm/etc/init/vendor.oplus.hardware.charger-V3-service.rc
  - odm/lib/vendor.oplus.hardware.charger-V3-ndk_platform.so
  - odm/lib64/vendor.oplus.hardware.charger-V3-ndk_platform.so
- id: ril_fix_a13
  description: RIL Fix for A13
  type: unzip_override
  source: devices/common/assets/ril_fix_a13_to_a15.zip
  target_base_dir: build/target/
  condition:
    android_version:
      min: 13
      max: 13
- id: nfc_fix_a13
  description: NFC Fix for A13
  type: unzip_override
  source: devices/common/assets/nfc_fix_for_a13.zip
  target_base_dir: build/target/
  condition:
    android_version:
      min: 13
      max: 13
  removes:
  - odm/bin/hw/vendor.oplus.hardware.nfc@1.0-service
  - odm/etc/init/vendor.oplus.hardware.nfc@1.0-service.rc
  - odm/etc/vintf/manifest/manifest_oplus_nfc.xml
  - odm/lib/vendor.oplus.hardware.nfc@1.0.so
- id: cryptoeng_fix_a13
  description: CryptoEng Fix for A13 (Conditional)
  type: unzip_override
  source: devices/common/assets/cryptoeng_fix_a13.zip
  target_base_dir: build/target/
  condition:
    and:
    - android_version:
        min: 13
        max: 13
    - file_exists: devices/common/assets/cryptoeng_fix_a13.zip
- id: clean_a13_services
  description: Clean unnecessary services and manifests for A13
  type: remove_files
  condition:
    android_version:
      min: 13
      max: 13
  files:
  - odm/bin/hw/vendor.oplus.hardware.charger@1.0-service
  - odm/bin/hw/vendor.oplus.hardware.wifi@1.1-service
  - odm/etc/init/vendor.oneplus.faceunlock.hal@1.0-service.rc
  - odm/etc/init/vendor.oplus.hardware.charger@1.0-service.rc
  - odm/etc/init/vendor.oplus.hardware.felica@1.0-service.rc
  - odm/etc/init/vendor.oplus.hardware.midas@1.0-service.rc
  - odm/etc/init/vendor.oplus.hardware.wifi@1.1-service-qcom.rc
  - odm/etc/vintf/manifest/manifest_opfaceunlock.xml
  - odm/etc/vintf/manifest/manifest_oplus_charger.xml
  - odm/etc/vintf/manifest/manifest_oplus_cryptoeng_hidl.xml
  - odm/etc/vintf/manifest/manifest_oplus_felica.xml
  - odm/etc/vintf/manifest/manifest_oplus_midas.xml
  - odm/etc/vintf/manifest/oplus_wifi_service_device.xml
  - odm/framework/vendor.oplus.hardware.wifi-V1.1-java.jar
  - odm/lib/vendor.oneplus.faceunlock.hal@1.0.so
  - odm/lib/vendor.oneplus.faceunlock.hal-V1-ndk_platform.so
  - odm/lib64/vendor.oneplus.faceunlock.hal@1.0.so
  - odm/lib64/vendor.oneplus.faceunlock.hal-V1-ndk_platform.so
  - odm/lib64/vendor.oplus.hardware.felica@1.0-impl.so
  - odm/lib64/vendor.oplus.hardware.felica@1.0.so
  - odm/lib64/vendor.oplus.hardware.subsys_radio-V1-ndk_platform.so
  - odm/lib64/vendor.oplus.hardware.subsys-V1-ndk_platform.so
  - odm/lib64/vendor.oplus.hardware.wifi@1.1.so
- id: remove_qualcomm_location
  description: Remove Qualcomm Location for A16 Port
  type: remove_files
  condition:
    and:
    - port_android_version:
        min: 16
        max: 16
    - base_android_version:
        max: 15
  files:
  - system_ext/priv-app/com.qualcomm.location
- id: nfc_fix_a16_v2
  description: NFC Fix A16 V2
  type: unzip_override
  source: devices/common/assets/nfc_fix_a16_v2.zip
  target_base_dir: build/target/
  condition:
    and:
    - port_android_version:
        min: 16
        max: 16
    - base_android_version:
        max: 14
    - file_exists: devices/common/assets/nfc_fix_a16_v2.zip
  removes:
  - system/system/priv-app/NfcNci
- id: wifi_fix_a16_cn
  description: WIFI Fix A16 (CN)
  type: unzip_override
  source: devices/common/assets/wifi_fix_a16.zip
  target_base_dir: build/target/
  condition:
    and:
    - port_android_version:
        min: 16
        max: 16
    - base_android_version:
        max: 14
    - region: CN
  removes:
  - system/system/apex/com.google.android.wifi.apex
- id: oos_1601_fix_global
  description: OOS 1601 Fix (Global)
  type: unzip_override
  source: devices/common/assets/oos_1601_fix.zip
  target_base_dir: build/target/
  condition:
    and:
    - port_android_version:
        min: 16
        max: 16
    - base_android_version:
        max: 14
    - rom_version:
        contains: 16.0.1
    - not:
        region: CN
- id: power_profile_copy
  description: Internal Power Profile Copy
  type: copy_file_internal
  source: odm/etc/power_profile/power_profile.xml
  target: my_product/cust/CN/etc/power_profile/power_profile.xml
  condition:
    target_exists: true
- id: copy_multimedia_xml
  description: Copy Multimedia XML files from baserom
  type: copy_files_from_stock
  source: my_product/etc/Multimedia_*.xml
  target_dir: my_product/etc/
- id: conditional_copy_sys_graphic_enhancement
  description: Copy sys_graphic_enhancement_config.json if exists in baserom
  type: conditional_copy
  source: my_product/etc/extension/sys_graphic_enhancement_config.json
  target: my_product/etc/extension/sys_graphic_enhancement_config.json
- id: sync_overlay_files
  description: Sync overlay files from baserom
  type: overlay_sync
  copy_vendor: true
  remove_patterns:
  - '*display*[0-9]*.apk'
  overlay_pattern: '*{my_product_type}*.apk'
- id: migrate_res_directory
  description: Replace res directory from baserom
  type: copy_files_from_stock
  source: my_product/res
  target_dir: my_product/res
- id: migrate_vendor_directory
  description: Replace vendor directory from baserom
  type: copy_files_from_stock
  source: my_product/vendor
  target_dir: my_product/vendor
- id: copy_sys_game_manager_config
  description: Copy sys_game_manager_config.json from baserom
  type: conditional_copy
  source: my_product/etc/extension/sys_game_manager_config.json
  target: my_product/etc/extension/sys_game_manager_config.json
- id: copy_audio_xml_files
  description: Copy audio*.xml files from baserom
  type: copy_files_from_stock
  source: my_product/etc/audio*.xml
  target_dir: my_product/etc/
- id: copy_default_volume_tables
  description: Copy default_volume_tables.xml from baserom
  type: conditional_copy
  source: my_product/etc/default_volume_tables.xml
  target: my_product/etc/default_volume_tables.xml
- id: copy_breenospeech2_directory
  description: Copy breenospeech2 directory from baserom
  type: conditional_copy
  source: my_product/etc/breenospeech2
  target: my_product/etc/breenospeech2
- id: copy_bootanimation_conditional
  description: Copy bootanimation directory (conditional based on ROM type)
  type: conditional_copy
  source: my_product/media/bootanimation
  target: my_product/media/bootanimation
  condition:
    or:
    - and:
      - base_rom_type: OxygenOS
      - port_rom_type: OxygenOS
    - and:
      - base_rom_type: ColorOS
      - or:
        - port_rom_type: ColorOS_Global
        - port_rom_type: ColorOS
- id: copy_quickboot_directory
  description: Copy quickboot directory from baserom
  type: conditional_copy
  source: my_product/media/quickboot
  target: my_product/media/quickboot
- id: copy_vibrator_directory
  description: Copy vibrator directory from baserom
  type: conditional_copy
  source: my_product/etc/vibrator
  target: my_product/etc/vibrator
- id: copy_fusionlight_profile_directory
  description: Copy fusionlight_profile directory from baserom
  type: conditional_copy
  source: my_product/etc/fusionlight_profile
  target: my_product/etc/fusionlight_profile
- id: copy_refresh_rate_config
  description: Copy refresh_rate_config.xml from baserom
  type: conditional_copy
  source: my_product/etc/refresh_rate_config.xml
  target: my_product/etc/refresh_rate_config.xml
- id: copy_resolution_switch_config
  description: Copy sys_resolution_switch_config.xml from baserom
  type: conditional_copy
  source: my_product/etc/sys_resolution_switch_config.xml
  target: my_product/etc/sys_resolution_switch_config.xml
- id: copy_sensor_config_xml
  description: Copy com.oplus.sensor_config.xml from baserom
  type: conditional_copy
  source: my_product/etc/permissions/com.oplus.sensor_config.xml
  target: my_product/etc/permissions/com.oplus.sensor_config.xml
- id: copy_ovms_files
  description: Copy OVMS_* files from baserom
  type: copy_files_from_stock
  source: my_product/etc/OVMS_*
  target_dir: my_product/etc/
- id: copy_super_computing_if_missing
  description: Copy super_computing directory from devices/common if missing
  type: copy_file_internal
  source: devices/common/super_computing
  target: my_product/etc/string_super_computing
  condition_target_exists: false
- id: face_unlock_fix_common
  description: Face unlock fix for SM8250/SM8350 devices on port>=15
  type: unzip_override
  source: devices/common/assets/face_unlock_fix_common.zip
  target_base_dir: build/target/
  condition:
    and:
    - or:
      - chipset: SM8250
      - chipset: SM8350
    - port_android_version:
        min: 15
- id: hdr_fix
  description: HDR fix for base Android 14 and below
  type: unzip_override
  source: devices/common/assets/hdr_fix.zip
  target_base_dir: build/target/
  condition:
    base_android_version:
      max: 14
- id: wallpaper_fix
  description: Wallpaper fix for non-CN, non-OOS ports below Android 16
  type: unzip_override
  source: devices/common/assets/wallpaper.zip
  target_base_dir: build/target/
  condition:
    and:
    - not:
        region: CN
    - not:
        base_rom_type: OxygenOS
    - port_android_version:
        max: 15
- id: realme_gesture_fix
  description: Realme gesture fix for non-Realme devices on port<16
  type: unzip_override
  source: devices/common/assets/realme_gesture.zip
  target_base_dir: build/target/
  condition:
    and:
    - not:
        base_brand: realme
    - port_android_version:
        max: 15
- id: gt_mode_overlay
  description: GT Mode overlay for non-Realme devices on port!=16
  type: unzip_override
  source: devices/common/assets/GTMode/overlay
  target_base_dir: build/target/
  condition:
    and:
    - not:
        base_brand: realme
    - not:
        port_android_version:
          min: 16
          max: 16
- id: debloat_apps
  description: Remove bloatware apps (del-app directories, HeartRateDetect, Browser)
  type: remove_files
  files:
  - my_product/del-app
  - system/system/del-app
  - my_product/app/HeartRateDetect
  - my_product/priv-app/HeartRateDetect
  - product/app/Browser
  - product/priv-app/Browser
  - system/system/app/Browser
  - system/system/priv-app/Browser
- id: remove_verity_keys
  description: Remove verity_key files from system, vendor, and product
  type: remove_files
  files:
  - system/system/verity_key
  - vendor/verity_key
  - product/verity_key
- id: remove_recovery_from_boot
  description: Remove recovery-from-boot.p files
  type: remove_files
  files:
  - system/system/recovery-from-boot.p
  - vendor/recovery-from-boot.p
- id: remove_auto_install
  description: Remove auto-install directory from product
  type: remove_files
  files:
  - product/etc/auto-install
- id: copy_vulkan_layer
  description: Copy vulkanLayer from baserom
  type: copy_files_from_stock
  source: system/system/vulkanLayer
  target_dir: system/system/vulkanLayer
- id: copy_gpu_drivers
  description: Copy gpudrivers from baserom
  type: copy_files_from_stock
  source: vendor/gpudrivers
  target_dir: vendor/gpudrivers
- id: copy_product_overlay_framework_jars
  description: Copy product_overlay framework jars from baserom
  type: copy_files_from_stock
  source: my_product/overlay/framework
  target_dir: my_product/overlay/framework
- id: camera_optimize_fix_sm8250
  description: Remove sys_camera_optimize_config.xml for SM8250 camera optimization
  type: remove_files
  condition:
    chipset: SM8250
  files:
  - my_product/etc/sys_camera_optimize_config.xml
- id: charger_v6_conditional
  description: Charger V6 update conditional on charger service existence in port
  type: unzip_override
  source: devices/common/assets/charger-v6-update.zip
  target_base_dir: build/target/
  condition:
    and:
    - file_exists_in_port: odm/bin/hw/vendor.oplus.hardware.charger-V3-service
    - android_version:
        min: 14
        max: 15
  removes:
  - odm/bin/hw/vendor.oplus.hardware.charger-V3-service
  - odm/etc/init/vendor.oplus.hardware.charger-V3-service.rc
  - odm/lib/vendor.oplus.hardware.charger-V3-ndk_platform.so
  - odm/lib64/vendor.oplus.hardware.charger-V3-ndk_platform.so
